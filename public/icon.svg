<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b4a" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#020202" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8432c" />
      <stop offset="100%" stop-color="#ff6b4a" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="#020202" />
  <circle cx="256" cy="256" r="256" fill="url(#glow)" />
  
  <!-- Dumbbell Icon -->
  <g transform="translate(256, 256) rotate(-45) translate(-256, -256)">
    <!-- Left Weight -->
    <rect x="136" y="206" width="36" height="100" rx="10" fill="url(#brand)" />
    <rect x="116" y="226" width="20" height="60" rx="6" fill="#ff6b4a" opacity="0.8" />
    
    <!-- Shaft -->
    <rect x="172" y="241" width="168" height="30" rx="6" fill="url(#brand)" />
    
    <!-- Right Weight -->
    <rect x="340" y="206" width="36" height="100" rx="10" fill="url(#brand)" />
    <rect x="376" y="226" width="20" height="60" rx="6" fill="#ff6b4a" opacity="0.8" />
  </g>
</svg>
